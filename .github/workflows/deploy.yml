name: CI - Testes Unitários

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # Testes Automatizados (CI)
  # ==========================================
  test:
    name: 🧪 Executar Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio respx pytest-mock httpx

      - name: 🧪 Rodar Testes do Backend & Scripts
        env:
          DATABASE_URL: 'sqlite://'
          SECRET_KEY: 'test-secret-key-for-github-actions-32-chars-long'
          SIMULATE_MESSAGING: 'false'
          PYTHONPATH: '.:backend'
        run: |
          python -m pytest scripts/tests/test_dispatch_portainer_webhooks.py -v
          python -m pytest backend/tests_unit/test_auth.py backend/tests_unit/test_invitations.py backend/tests_unit/test_password_reset_link.py backend/tests_unit/test_checkout_pre_populado.py backend/tests_unit/test_hotmart_order_bump_payload.py -v

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar Dependências do Frontend
        run: |
          cd frontend
          npm ci

      - name: 🧪 Rodar Testes do Frontend
        run: |
          cd frontend
          npx vitest run src/pages/ResetPassword/ResetPassword.test.jsx src/pages/InviteRegister/InviteRegister.test.jsx src/utils/__tests__/passwordGenerator.test.js
